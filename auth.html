<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login & Signup</title>
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <div class="card">
      <div class="tabs" role="tablist" aria-label="Authentication switch">
        <button class="tab-btn active" data-mode="login" type="button">Login</button>
        <button class="tab-btn" data-mode="signup" type="button">Sign Up</button>
      </div>

      <div class="forms">
        <form class="form active" id="loginForm">
          <h2 class="title">Welcome back</h2>
          <p class="subtitle">Log in to continue to your account.</p>

          <div class="field">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" placeholder="Enter your password" required />
          </div>

          <button type="submit">Log In</button>
          <p class="helper-text">
            <button class="link-btn" id="forgotPasswordBtn" type="button">Forgot password?</button>
          </p>
        </form>

        <form class="form" id="resetForm">
          <h2 class="title">Reset password</h2>
          <p class="subtitle">Enter your email and we’ll send a reset link.</p>

          <div class="field">
            <label for="resetEmail">Email</label>
            <input id="resetEmail" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <button type="submit">Send reset email</button>
          <p class="helper-text">
            <button class="link-btn" id="backToLoginBtn" type="button">Back to login</button>
          </p>
        </form>

        <form class="form" id="signupForm">
          <h2 class="title">Create account</h2>
          <p class="subtitle">Sign up for a new account in seconds.</p>

          <div class="field">
            <label for="signupName">Full name</label>
            <input id="signupName" name="name" type="text" placeholder="Your name" required />
          </div>

          <div class="field">
            <label for="signupEmail">Email</label>
            <input id="signupEmail" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="signupPassword">Password</label>
            <input id="signupPassword" name="password" type="password" placeholder="Create a password" required />
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter password" required />
          </div>

          <button type="submit">Create Account</button>
        </form>
      </div>

      <div id="statusMessage" class="status" aria-live="polite"></div>
    </div>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
