<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GreenBit Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            🌿 GreenBit CMS

        </div>

        <ul>

            <li class="active">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </li>

            <li>
                <i class="bi bi-journal-text"></i>
                Blogs
            </li>

            <li>
                <i class="bi bi-people"></i>
                Users
            </li>

            <li>
                <i class="bi bi-gear"></i>
                Settings
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="content">

        <div class="topbar">

            <h2>

                Dashboard

            </h2>

            <button
                class="btn btn-success"
                id="newBlogBtn">

                <i class="bi bi-plus-circle"></i>

                New Blog

            </button>

        </div>

        <!-- Statistics -->

        <div class="row g-4 mt-2">

            <div class="col-lg-4">

                <div class="stat-card">

                    <h5>Total Blogs</h5>

                    <h2 id="totalBlogs">

                        0

                    </h2>

                </div>

            </div>

            <div class="col-lg-4">

                <div class="stat-card">

                    <h5>Total Users</h5>

                    <h2 id="totalUsers">

                        0

                    </h2>

                </div>

            </div>

            <div class="col-lg-4">

                <div class="stat-card">

                    <h5>Published Today</h5>

                    <h2 id="todayBlogs">

                        0

                    </h2>

                </div>

            </div>

        </div>

        <!-- Blog Form -->

        <div class="card mt-5 shadow-sm" id="blogFormCard">

            <div class="card-header">

                Publish New Blog

            </div>

            <div class="card-body">

                <div class="mb-3">

                    <label>Title</label>

                    <input
                        id="title"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label>Summary</label>

                    <textarea
                        id="summary"
                        rows="3"
                        class="form-control"></textarea>

                </div>

                <div class="mb-3">

                    <label>Image URL</label>

                    <input
                        id="imageURL"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label>Content</label>

                    <textarea
                        id="content"
                        rows="8"
                        class="form-control"></textarea>

                </div>

                <button
                    id="publishBtn"
                    class="btn btn-success">

                    Publish Blog

                </button>

            </div>

        </div>

        <!-- Blog Table -->

        <div class="card shadow-sm mt-5">

            <div class="card-header">

                Published Blogs

            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>

                        <tr>

                            <th>Image</th>

                            <th>Title</th>

                            <th>Author</th>

                            <th>Date</th>

                            <th width="180">

                                Actions

                            </th>

                        </tr>

                    </thead>

                    <tbody id="blogTable">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<script type="module" src="js/dashboard.js"></script>

</body>

</html>
